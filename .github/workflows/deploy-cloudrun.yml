name: Deploy to Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

env:
  SERVICE: roaming-beaver-web
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Resolve image tag
        id: meta
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::GCP_PROJECT_ID variable is empty. Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          AUTH_PROJECT="${CLOUDSDK_CORE_PROJECT:-${GOOGLE_CLOUD_PROJECT:-}}"
          if [[ -n "${AUTH_PROJECT}" && "${AUTH_PROJECT}" != "${PROJECT_ID}" ]]; then
            echo "::error::GCP_PROJECT_ID is '${PROJECT_ID}' but GCP_SA_KEY belongs to project '${AUTH_PROJECT}'. Set the GitHub variable GCP_PROJECT_ID to '${AUTH_PROJECT}' (your real GCP project id, not the GitHub repo name)."
            exit 1
          fi
          REPO="${{ vars.GCP_ARTIFACT_REPO || 'roaming-beaver' }}"
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Using image ${IMAGE}:${SHA_SHORT}"

      - name: Ensure Artifact Registry repo
        run: |
          PROJECT_ID="${{ steps.meta.outputs.project_id }}"
          REPO="${{ steps.meta.outputs.repo }}"
          if ! gcloud artifacts repositories describe "${REPO}" \
            --project="${PROJECT_ID}" --location="${REGION}" &>/dev/null; then
            echo "Creating Artifact Registry repo ${REPO} in ${REGION} (project ${PROJECT_ID})…"
            gcloud artifacts repositories create "${REPO}" \
              --project="${PROJECT_ID}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="Roaming Beaver images"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            -t "${{ steps.meta.outputs.full }}" \
            -t "${{ steps.meta.outputs.latest }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.meta.outputs.full }}"
          docker push "${{ steps.meta.outputs.latest }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.meta.outputs.full }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --concurrency=80
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=20
            --cpu-boost
          env_vars: |
            NODE_ENV=production
            ASSEMBLY_FEE_RATE=${{ vars.ASSEMBLY_FEE_RATE || '0.08' }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            DUFFEL_API_KEY=DUFFEL_API_KEY:latest
            STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest
            STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:latest

      - name: Summary
        run: |
          echo "### Deployed \`${{ env.SERVICE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ steps.meta.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is the first deploy, set \`NEXT_PUBLIC_APP_URL\` repo variable to that URL and re-run so client-side auth redirects match." >> "$GITHUB_STEP_SUMMARY"
